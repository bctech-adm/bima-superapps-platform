name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - name: denylist (pola generik)
        run: |
          set -euo pipefail
          if [ -s scripts/denylist.example.txt ]; then
            if git grep -n -I -i -E -f scripts/denylist.example.txt -- . ':!scripts/denylist.example.txt'; then
              echo "::error::Pola terlarang ditemukan (lihat di atas)"; exit 1
            fi
          fi
